name: brew test-bot

# Homebrew will not look at a cask that is not inside a tap, so the checks
# cannot simply be `brew style` and `brew audit` against a path. test-bot is
# what knows how to present this checkout as the tap it is; --only-tap-syntax
# is the pass that runs style and audit over everything in it.
on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  # One runner, not the usual matrix: syntax, style and audit do not vary by
  # host, and the only cask here refuses to install anywhere but arm64 macOS
  # anyway. A matrix would buy three copies of the same answer.
  tap-syntax:
    runs-on: macos-26
    steps:
      - name: Set up Homebrew
        id: set-up-homebrew
        uses: Homebrew/actions/setup-homebrew@main
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Cache Homebrew Bundler RubyGems
        uses: actions/cache@v5
        with:
          path: ${{ steps.set-up-homebrew.outputs.gems-path }}
          key: rubygems-${{ steps.set-up-homebrew.outputs.gems-hash }}
          restore-keys: rubygems-

      - run: brew test-bot --only-cleanup-before
      - run: brew test-bot --only-setup
      - run: brew test-bot --only-tap-syntax
